name: Release APKs

on:
  push:
    branches: [ "master", "phase*" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build and test
      run: ./gradlew build

    # Debug APKs are signed with a throwaway key, so they can be installed directly.
    - name: Collect APKs
      run: |
        mkdir dist
        for module in app nfcemvread readnfcmessage; do
          cp "$module/build/outputs/apk/debug/$module-debug.apk" dist/
        done

    - uses: actions/upload-artifact@v4
      with:
        name: apks
        path: dist/*.apk
        if-no-files-found: error

  # Separate job so that the build, which runs third-party code, never holds a write token.
  release:

    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: apks
        path: dist

    - name: Publish pre-release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "build-${GITHUB_RUN_NUMBER}" dist/*.apk \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --prerelease \
          --title "Build ${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})" \
          --notes "Debug build of ${GITHUB_SHA} for testing. Each build is signed with a different key: uninstall the previous version before installing this one."
